[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yougene"
version = "0.1.0"
description = "Local-first genetic exploration (synthetic scaffold)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "platformdirs>=4.3", "duckdb>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.11"]

[project.scripts]
yougene = "yougene.cli:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only keep temp folders of failed tests; they hold synthetic data and add up.
tmp_path_retention_policy = "failed"

[tool.ruff.lint.per-file-ignores]
# Test data tables read better one record per line.
"tests/**" = ["E501"]
# Long SQL lines read better unwrapped.
"yougene/importers/vcf.py" = ["E501"]
