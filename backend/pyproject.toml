[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yougene"
version = "0.1.0"
description = "Local-first genetic exploration (synthetic scaffold)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "platformdirs>=4.3",
    "duckdb>=1.2",
    # Inertia server adapter from the Fancy kit; not on PyPI yet, pinned to a commit.
    "fancy-inertia-server @ git+https://github.com/Particle-Academy/fancy-inertia-server@1cb476d3bd463c2ec9c2f4210891808cc66edbbd",
    # Y haplogroups. 23andMe's licence: non-commercial use (see README).
    "yhaplo @ git+https://github.com/23andMe/yhaplo@f72f88f2818aebd049c29d2ca8fc2f30c3003b17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.11"]

[project.scripts]
yougene = "yougene.cli:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only keep temp folders of failed tests; they hold synthetic data and add up.
tmp_path_retention_policy = "failed"

[tool.ruff.lint.per-file-ignores]
# Test data tables read better one record per line.
"tests/**" = ["E501"]
# Long SQL lines read better unwrapped.
"yougene/importers/vcf.py" = ["E501"]
